# Supabase CLI の設定（Edge Functions のデプロイで使用）
project_id = "golf-lesson"

# Stripe からの通知はログインユーザーではないため、JWT 検証を無効にする
# （代わりに Stripe の署名を検証している）
[functions.stripe-webhook]
verify_jwt = false

# 古い動画の自動削除は定期実行から呼ばれるため、JWT 検証を無効にする
# （代わりに CRON_SECRET を確認している）
[functions.purge-old-videos]
verify_jwt = false

# 面談前日のお知らせメールは定期実行から呼ばれるため、JWT 検証を無効にする
# （代わりに CRON_SECRET を確認している）
[functions.meeting-reminders]
verify_jwt = false
