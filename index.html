<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Golf Lesson Prototype</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;background:#f5f6f7;color:#172018}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px 16px;background:#172018;color:#fff}.app{max-width:760px;margin:auto;min-height:100vh;background:#fff}.top{padding:18px 20px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff;z-index:2}.brand{font-weight:800}.muted{color:#777;font-size:13px}.content{padding:20px}.hero{background:#172018;color:white;border-radius:20px;padding:22px;margin-bottom:16px}.hero h1{margin:6px 0 10px;font-size:25px}.pill{display:inline-block;background:#e8efe9;color:#172018;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700}.card{border:1px solid #e6e8e6;border-radius:16px;padding:17px;margin:12px 0;background:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#f5f7f5;border-radius:14px;padding:14px}.stat b{font-size:22px;display:block;margin-top:5px}.section-title{display:flex;justify-content:space-between;align-items:center;margin-top:24px}.section-title h2{font-size:18px;margin:0}.task{display:flex;gap:12px;align-items:center}.check{width:28px;height:28px;border-radius:50%;background:#e9eee9;color:#172018;display:grid;place-items:center;font-weight:800}.nav{position:sticky;bottom:0;background:#fff;border-top:1px solid #eee;display:grid;grid-template-columns:repeat(3,1fr);padding:8px}.nav button{background:white;color:#555;padding:10px 4px}.nav button.active{color:#172018;font-weight:800}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:16px}.tabs button{white-space:nowrap;background:#eef1ee;color:#263127}.tabs button.active{background:#172018;color:#fff}.form label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}.form input,.form textarea,.form select{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;background:#fff}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.notice{background:#fff7dc;border:1px solid #f1dfa0;padding:12px;border-radius:12px;font-size:13px}.login{padding:40px 24px;min-height:100vh;display:grid;align-content:center}.login h1{font-size:30px}.danger{background:#eee;color:#333}.small{font-size:12px}.hidden{display:none!important}
</style></head><body><div class="app" id="app"></div><script>
const defaultData={member:{name:'○○さん',plan:'STANDARD',goal:'90切り',best:'94',avg:'98',theme:'ドライバーの方向性を安定させる',tasks:[{t:'ドライバー ハーフスイング',d:'20球',done:false},{t:'7I インパクト練習',d:'30球',done:false},{t:'ドライバー 実戦イメージ',d:'20球',done:false}],lesson:{date:'2026.09.25',title:'ドライバーの右プッシュ',point:'切り返しで上体が先行している',feedback:'今回は上体から切り返すことでフェースが開きやすくなっています。まずは下半身から動き出す感覚を作りましょう。'},history:[{date:'2026.09.25',title:'ドライバーの右プッシュ'},{date:'2026.09.18',title:'アイアンのコンタクト'},{date:'2026.09.11',title:'切り返しの順序'}]},members:[{id:'001',name:'○○さん',plan:'STANDARD',goal:'90切り',best:'94',avg:'98'}]};
let data=JSON.parse(localStorage.getItem('golfData')||JSON.stringify(defaultData));let role=localStorage.getItem('golfRole');let view='home';
function save(){localStorage.setItem('golfData',JSON.stringify(data))}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function login(){app.innerHTML=`<div class="login"><div><span class="pill">ONLINE GOLF LESSON</span><h1>あなた専用の<br>ゴルフカルテ</h1><p class="muted">試作品：会員側と管理者側の画面を体験できます。</p><button onclick="enter('member')" style="width:100%;margin-top:14px">会員として見る</button><button onclick="enter('admin')" class="danger" style="width:100%;margin-top:8px">管理者として見る</button><p class="small muted">※第1版はブラウザ内にデータを保存するデモです。本番公開時は安全な認証・データベースへ移行します。</p></div></div>`}
function enter(r){role=r;localStorage.setItem('golfRole',r);view=r==='admin'?'members':'home';render()}
function header(title){return `<div class="top"><div><div class="brand">${title}</div><div class="muted">Online Golf Lesson</div></div><button class="danger" onclick="logout()">ログアウト</button></div>`}function logout(){localStorage.removeItem('golfRole');login()}
function memberHome(){const m=data.member;return header('マイページ')+`<div class="content"><div class="hero"><div class="pill">${esc(m.plan)}</div><h1>${esc(m.name)}、おかえりなさい。</h1><div class="muted" style="color:#d9e1da">現在の目標</div><h2 style="margin:5px 0 0">${esc(m.goal)}</h2><div style="margin-top:14px">今月のテーマ：${esc(m.theme)}</div></div><div class="grid"><div class="stat"><div class="muted">Best Score</div><b>${esc(m.best)}</b></div><div class="stat"><div class="muted">平均スコア</div><b>${esc(m.avg)}</b></div></div><div class="section-title"><h2>🔥 今週の課題</h2><span class="muted">${m.tasks.filter(x=>x.done).length}/${m.tasks.length}</span></div>${m.tasks.map((x,i)=>`<div class="card task"><div class="check">${x.done?'✓':''}</div><div><b>${esc(x.t)}</b><div class="muted">${esc(x.d)}</div></div></div>`).join('')}<div class="section-title"><h2>🎥 最新レッスン</h2></div><div class="card"><div class="muted">${esc(m.lesson.date)}</div><h3 style="margin:7px 0">${esc(m.lesson.title)}</h3><b>今回のポイント</b><p>${esc(m.lesson.point)}</p><button onclick="view='lesson';render()">レッスンを見る</button></div><button onclick="view='submit';render()" style="width:100%;margin-top:8px">＋ 動画を提出する</button><div class="section-title"><h2>📈 上達記録</h2></div><div class="grid"><div class="stat"><div class="muted">Best</div><b>94 → ${esc(m.best)}</b></div><div class="stat"><div class="muted">平均</div><b>98 → ${esc(m.avg)}</b></div></div></div>${memberNav('home')}`}
function memberNav(active){return `<div class="nav"><button class="${active==='home'?'active':''}" onclick="view='home';render()">🏠<br><span class="small">ホーム</span></button><button class="${active==='submit'?'active':''}" onclick="view='submit';render()">📹<br><span class="small">動画提出</span></button><button class="${active==='history'?'active':''}" onclick="view='history';render()">📚<br><span class="small">履歴</span></button></div>`}
function submitPage(){return header('動画を提出')+`<div class="content"><div class="notice">動画を送る前に、正面または後方から全身とクラブが入るように撮影してください。</div><div class="card form"><label>クラブ</label><select id="club"><option>ドライバー</option><option>7I</option><option>ウェッジ</option><option>パター</option><option>その他</option></select><label>撮影方向</label><select id="angle"><option>正面</option><option>後方</option></select><label>動画</label><input id="file" type="file" accept="video/*"><label>今回気になっていること</label><textarea id="question" rows="5" placeholder="例：最近ドライバーが右に出ます"></textarea><button style="width:100%;margin-top:14px" onclick="submitVideo()">動画を提出する</button></div></div>${memberNav('submit')}`}
function submitVideo(){alert('試作品：動画提出データを受け付けました。\n本番版では管理者画面に届きます。');view='home';render()}
function lessonPage(){const m=data.member;return header('レッスン詳細')+`<div class="content"><div class="muted">${esc(m.lesson.date)}</div><h1>${esc(m.lesson.title)}</h1><div class="card"><b>今回の診断</b><h2>${esc(m.lesson.point)}</h2><p>${esc(m.lesson.feedback)}</p></div><div class="card"><b>次回までの練習</b><p>① ハーフスイング 20球</p><p>② 7I 30球</p><p>③ ドライバー 20球</p></div><button onclick="view='home';render()">ホームへ戻る</button></div>${memberNav('home')}`}
function historyPage(){return header('レッスン履歴')+`<div class="content">${data.member.history.map(h=>`<div class="card"><div class="muted">${esc(h.date)}</div><h3>${esc(h.title)}</h3><button onclick="view='lesson';render()">詳細を見る</button></div>`).join('')}</div>${memberNav('history')}`}
function adminMembers(){return header('管理者ダッシュボード')+`<div class="content"><div class="hero"><div class="pill">ADMIN</div><h1>会員を管理する</h1><p style="color:#d9e1da">会員情報を変更すると、会員ページに反映されます。</p></div><div class="section-title"><h2>会員一覧</h2><button onclick="view='edit';render()">＋ 新規</button></div>${data.members.map((m,i)=>`<div class="card"><div class="row"><div><b>${esc(m.name)}</b><div class="muted">${esc(m.plan)} / ${esc(m.goal)}</div></div><button onclick="editMember(${i})">編集</button></div></div>`).join('')}<div class="card"><b>現在の会員ページを確認</b><p class="muted">管理者が編集した内容がどのように表示されるか確認できます。</p><button onclick="enter('member')">会員画面を見る</button></div></div>`}
function editMember(i=0){const m=data.members[i]||data.member; data.editIndex=i; view='edit'; render()}function editPage(){const i=data.editIndex??0;const m=data.members[i]||data.member;return header('会員情報を編集')+`<div class="content form"><div class="card"><label>会員名</label><input id="name" value="${esc(m.name)}"><label>プラン</label><select id="plan"><option ${m.plan==='BASIC'?'selected':''}>BASIC</option><option ${m.plan==='STANDARD'?'selected':''}>STANDARD</option><option ${m.plan==='PREMIUM'?'selected':''}>PREMIUM</option></select><label>目標</label><input id="goal" value="${esc(m.goal)}"><label>Best Score</label><input id="best" value="${esc(m.best)}"><label>平均スコア</label><input id="avg" value="${esc(m.avg)}"><label>今月のテーマ</label><input id="theme" value="${esc(data.member.theme)}"><label>今週の練習①</label><input id="task1" value="${esc(data.member.tasks[0].t)}"><label>今週の練習②</label><input id="task2" value="${esc(data.member.tasks[1].t)}"><label>今週の練習③</label><input id="task3" value="${esc(data.member.tasks[2].t)}"><label>最新レッスンのタイトル</label><input id="ltitle" value="${esc(data.member.lesson.title)}"><label>今回のポイント</label><input id="lpoint" value="${esc(data.member.lesson.point)}"><label>フィードバック</label><textarea id="feedback" rows="5">${esc(data.member.lesson.feedback)}</textarea><button style="width:100%;margin-top:15px" onclick="saveMember()">保存する</button><button class="danger" style="width:100%;margin-top:8px" onclick="view='members';render()">戻る</button></div></div>`}
function saveMember(){const i=data.editIndex??0;const m=data.members[i]||data.member;Object.assign(m,{name:document.getElementById('name').value,plan:document.getElementById('plan').value,goal:document.getElementById('goal').value,best:document.getElementById('best').value,avg:document.getElementById('avg').value});Object.assign(data.member,m,{theme:document.getElementById('theme').value,tasks:[{t:document.getElementById('task1').value,d:'20球',done:false},{t:document.getElementById('task2').value,d:'30球',done:false},{t:document.getElementById('task3').value,d:'20球',done:false}],lesson:{date:'2026.09.26',title:document.getElementById('ltitle').value,point:document.getElementById('lpoint').value,feedback:document.getElementById('feedback').value}});save();alert('保存しました。会員ページに反映されます。');view='members';render()}
function render(){if(!role)return login();if(role==='member'){if(view==='home')app.innerHTML=memberHome();else if(view==='submit')app.innerHTML=submitPage();else if(view==='lesson')app.innerHTML=lessonPage();else app.innerHTML=historyPage()}else{if(view==='members')app.innerHTML=adminMembers();else app.innerHTML=editPage()}}
render();
</script></body></html>
